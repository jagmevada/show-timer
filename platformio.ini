; remote_v2 firmware. Same upload setup as timer_remote_code (pymcuprog SerialUPDI on J4).
; Second env: panel_sim = a remote_v2 board pretending to be the show-timer panel (pio run -e panel_sim -t upload).

[platformio]
default_envs = ATtiny3226

[env:ATtiny3226]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino
board_build.f_cpu = 10000000L   ; VCC 3.37 V: 20 MHz needs 4.5 V
board_hardware.oscillator = internal
board_hardware.bod = disabled
upload_speed = 230400
upload_flags =
	--tool
	uart
	--device
	attiny3226
	--uart
	$UPLOAD_PORT
	--clk
	$UPLOAD_SPEED
upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE
monitor_speed = 115200
lib_deps = lexus2k/lcdgfx@^1.1.5
build_src_filter = +<*> -<panel_sim.cpp> -<radiotest.cpp>

[env:panel_sim]
extends = env:ATtiny3226
build_src_filter = +<*> -<main.cpp> -<radiotest.cpp>

[env:radiotest]  ; same code on two boards: each sends a counter and shows what it hears
extends = env:ATtiny3226
build_src_filter = +<*> -<main.cpp> -<panel_sim.cpp>
