; remote_v2 bring-up. Same upload setup as timer_remote_code (pymcuprog SerialUPDI on J4).
[platformio]
src_dir = .

[env:ATtiny3226]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino
board_build.f_cpu = 10000000L   ; VCC 3.37 V: 20 MHz needs 4.5 V
board_hardware.oscillator = internal
board_hardware.bod = disabled
upload_speed = 230400
upload_flags =
	--tool
	uart
	--device
	attiny3226
	--uart
	$UPLOAD_PORT
	--clk
	$UPLOAD_SPEED
upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE
monitor_speed = 115200
